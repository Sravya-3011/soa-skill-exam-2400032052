
name: city-deployment

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: soataskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - city-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soataskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  exam-service:
    build:
      context: ./CityProject
      dockerfile: Dockerfile
    image: chakkasravyanjali/docker-skill-exam-2400032052:latest
    container_name: city-backend
    ports:
      - "2052:8001"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - city-network

volumes:
  postgres_data:

networks:
  city-network:
    driver: bridge
